spring.main.allow-circular-references=true
# spring.autoconfigure.exclude=none
spring.devtools.restart.log-condition-evaluation-delta=false

# Hostname of the frontend
frontend.host=http://localhost:4300

server.servlet.context-path=/invest

# JWT
token.secret=

# autenticacao acesso cidadao
spring.security.oauth2.client.provider.acessocidadao.issuer-uri=https://acessocidadao.es.gov.br/is
